<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>LolCoach — olho</title>
<style>
body{margin:0;background:#000;color:#9ab;font:12px/1.4 Consolas,monospace}
canvas,video{display:block}
#log{white-space:pre-wrap;padding:6px}
</style>
</head>
<body>
<video id="v" muted autoplay playsinline></video>
<canvas id="tela"></canvas>
<pre id="log"></pre>
<script>
/*
 * O olho: captura a tela (como o OBS), acha o minimapa no canto, e procura
 * nele o ícone de cada inimigo — igual a olhar o minimapa, só que 10x por
 * segundo e sem perder um. Nada de memória do jogo: só pixels da sua tela.
 *
 *   1. calibrar: onde está o minimapa (canto de baixo, tamanho) — casa o
 *      quadrado com a textura do mapa (recursos do Community Dragon).
 *   2. escala: que tamanho os ícones têm — procura o MEU ícone em vários
 *      tamanhos; o que casar melhor é o tamanho de todos.
 *   3. cada quadro: pra cada inimigo vivo, procura o ícone dele (correlação
 *      normalizada, meia resolução; confirma em cor na resolução cheia).
 *      Quem foi visto há pouco é procurado só em volta de onde estava.
 *   4. manda pro daemon (POST /api/olho) 5x por segundo.
 */
const Q = new URLSearchParams(location.search);
const TESTE = Q.get('teste') === '1';
const SO_TELA = Q.get('tela') === '1';
const FINGIR = Q.get('fingir') === '1';   // captura de verdade, inimigos de mentira (teste com ?tela=1 aberto)
const AMOSTRA = Q.get('amostra');         // ?amostra=/caminho/0425.png — roda a leitura numa foto gravada (e o .json do lado dá quem está na partida)
// Ritmo: 4 leituras por segundo dão conta (o ícone anda 0,7%/s; flash é pego no par de quadros seguidos).
// ?leve=1 (modo leve, pra PC fraco): 2 por segundo, captura a 5 fps, sem placar, um ícone por quadro no mapa todo.
const LEVE = Q.get('leve') === '1';
const INTERVALO = LEVE ? 500 : 250;    // ms entre leituras
const N = 48;                          // grade da calibração do minimapa
const LIMIAR_MAPA = 0.42, LIMIAR_MEIO = 0.45, LIMIAR_NOVO = 0.76, LIMIAR_SEGUIDO = 0.66, LIMIAR_EU = 0.8, LIMIAR_MANCHA = 0.74, MARGEM = 0.04;
let ultimoDiag = 0, ultimaFoto = 0, fotos = 0; const melhoresDoQuadro = new Map();
let cegoDesde = 0, cegoAvisado = 0, fracoDesde = 0;
/**
 * Cores dos anéis APRENDIDAS nesta instalação. O LoL de cada pessoa é
 * diferente (modo daltônico troca vermelho/azul, HUD e minimapa mudam de
 * tamanho), então as regras fixas são só o ponto de partida: cada ícone
 * confirmado com nota alta (≥ 0,85) doa a cor da sua borda, e depois de 25
 * amostras a cor média passa a valer no lugar da regra. Fica no localStorage
 * da janela do olho, de uma partida pra outra.
 */
const cores = (() => { try { return JSON.parse(localStorage.getItem('olho.cores') || 'null') ?? {}; } catch { return {}; } })();
// cor de anel é SATURADA (vermelho 169,61,56 · azul ~90,170,240); uma média sem graça (73,103,130 = rio) é
// aprendizado ruim — casar pixels a 40 dela enche o minimapa de 'manchas' de rio/terreno e engole os ícones
const croma = (c) => Math.max(c.r, c.g, c.b) - Math.min(c.r, c.g, c.b);
for (const k of ['inimigo', 'aliado', 'eu']) { cores[k] ??= { r: 0, g: 0, b: 0, n: 0 }; if (cores[k].n >= 25 && croma(cores[k]) < 80) cores[k] = { r: 0, g: 0, b: 0, n: 0 }; }
const corPronta = (k) => cores[k].n >= 25 && croma(cores[k]) >= 80;
const distCor = (r, g, b, c) => Math.hypot(r - c.r, g - c.g, b - c.b);
let coresAvisadas = false;
function aprenderCor(k, cor) {
  if (!cor) return;
  const c = cores[k], w = Math.min(c.n, 60);   // média corrida (as últimas ~60 pesam mais)
  c.r = (c.r * w + cor[0]) / (w + 1); c.g = (c.g * w + cor[1]) / (w + 1); c.b = (c.b * w + cor[2]) / (w + 1); c.n++;
  if (c.n % 10 === 0) { try { localStorage.setItem('olho.cores', JSON.stringify(cores)); } catch { /* sem espaço */ } }
  if (!coresAvisadas && ['inimigo', 'aliado', 'eu'].every(corPronta)) { coresAvisadas = true; log(`cores calibradas nesta tela: inimigo ${[cores.inimigo.r, cores.inimigo.g, cores.inimigo.b].map(Math.round)}, aliado ${[cores.aliado.r, cores.aliado.g, cores.aliado.b].map(Math.round)}, eu ${[cores.eu.r, cores.eu.g, cores.eu.b].map(Math.round)}`); }
}

const $log = document.getElementById('log');
const log = (...a) => { const t = a.join(' '); $log.textContent = (t + '\n' + $log.textContent).slice(0, 3000); console.log('[olho]', t); };
const semAcento = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[^a-z]/g, '');
const carregar = (src) => new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => erro(new Error('imagem ' + src)); i.src = src; });

/* ------------------------------------------------------------ imagem */
function cinzaDe(data, w, h) {
  const g = new Float32Array(w * h);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = 0.299 * data[j] + 0.587 * data[j + 1] + 0.114 * data[j + 2];
  return g;
}
function meia(g, w, h) {                // 2x2 média
  const w2 = w >> 1, h2 = h >> 1, m = new Float32Array(w2 * h2);
  for (let y = 0; y < h2; y++) for (let x = 0; x < w2; x++) {
    const i = (2 * y) * w + 2 * x;
    m[y * w2 + x] = (g[i] + g[i + 1] + g[i + w] + g[i + w + 1]) * 0.25;
  }
  return { g: m, w: w2, h: h2 };
}
function sat(g, w, h) {                 // tabela de soma acumulada (w+1)x(h+1)
  const W1 = w + 1, s = new Float64Array(W1 * (h + 1));
  for (let y = 1; y <= h; y++) { let linha = 0; for (let x = 1; x <= w; x++) { linha += g[(y - 1) * w + (x - 1)]; s[y * W1 + x] = s[(y - 1) * W1 + x] + linha; } }
  return { s, W1 };
}
const caixa = (S, x1, y1, x2, y2) => S.s[y2 * S.W1 + x2] - S.s[y1 * S.W1 + x2] - S.s[y2 * S.W1 + x1] + S.s[y1 * S.W1 + x1];
function zeroMedia(a) {
  let s = 0; for (const v of a) s += v; const m = s / a.length;
  const z = new Float32Array(a.length); let n2 = 0;
  for (let i = 0; i < a.length; i++) { z[i] = a[i] - m; n2 += z[i] * z[i]; }
  return { z, norma: Math.sqrt(n2) + 1e-6 };
}
function ncc(a, tpl) {                  // a: valores; tpl: {z, norma}
  let s = 0; for (const v of a) s += v; const m = s / a.length;
  let num = 0, da = 0;
  for (let i = 0; i < a.length; i++) { const x = a[i] - m; num += x * tpl.z[i]; da += x * x; }
  return num / (Math.sqrt(da) * tpl.norma + 1e-6);
}

/* ------------------------------------------------------- fonte de vídeo */
const video = document.getElementById('v');
const tela = document.getElementById('tela');
let W = 0, H = 0, fonte = null;          // fonte: o que desenhar (video ou canvas de teste)
async function abrirCaptura() {
  if (TESTE) { fonte = telaFalsa(1920, 1080); W = 1920; H = 1080; return; }
  if (AMOSTRA) {
    // a foto do minimapa colada no canto de uma tela 1920×1080 (onde o jogo desenha o minimapa)
    const img = new Image(); img.src = AMOSTRA; await new Promise((ok, erro) => { img.onload = ok; img.onerror = erro; });
    const c = telaFalsa(1920, 1080); const x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, 1920, 1080);
    x.drawImage(img, 1920 - img.width - 16, 1080 - img.height - 16);
    fonte = c; W = 1920; H = 1080; return;
  }
  const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: LEVE ? 5 : 8, max: LEVE ? 6 : 10 } }, audio: false });
  video.srcObject = stream;
  await new Promise((ok) => { video.onloadedmetadata = ok; });
  await video.play().catch(() => {});
  W = video.videoWidth; H = video.videoHeight; fonte = video;
  if (!W || !H) throw new Error('captura sem tamanho (tela cheia exclusiva?)');
  stream.getVideoTracks()[0].onended = () => { log('captura encerrada'); fonte = null; };
}
const ctxDe = (c) => c.getContext('2d', { willReadFrequently: true });
function pedaco(x, y, w, h) {           // ImageData de um retângulo da fonte
  if (tela.width !== w || tela.height !== h) { tela.width = w; tela.height = h; }
  const c = ctxDe(tela);
  c.drawImage(fonte, x, y, w, h, 0, 0, w, h);
  return c.getImageData(0, 0, w, h).data;
}

/* ------------------------------------------------------- 1. calibrar */
let mapaTpl = null, calib = null, tentativasCalib = 0;
async function prepararMapa() {
  const img = await carregar('/minimapa.png');
  const c = new OffscreenCanvas(N, N); const x = ctxDe(c); x.drawImage(img, 0, 0, N, N);
  mapaTpl = zeroMedia(cinzaDe(x.getImageData(0, 0, N, N).data, N, N));
}
function pontuarQuadrado(S, x, y, s) {
  const cel = new Float32Array(N * N);
  for (let j = 0; j < N; j++) {
    const y1 = y + Math.round(j * s / N), y2 = y + Math.round((j + 1) * s / N);
    for (let i = 0; i < N; i++) {
      const x1 = x + Math.round(i * s / N), x2 = x + Math.round((i + 1) * s / N);
      cel[j * N + i] = caixa(S, x1, y1, x2, y2) / ((x2 - x1) * (y2 - y1));
    }
  }
  return ncc(cel, mapaTpl);
}
function calibrar() {
  const R = Math.min(H, Math.round(H * 0.52) + 20);
  let melhor = { score: -1 };
  for (const canto of ['dir', 'esq']) {
    const ox = canto === 'dir' ? W - R : 0, oy = H - R;
    const g = cinzaDe(pedaco(ox, oy, R, R), R, R);
    const S = sat(g, R, R);
    const sMin = Math.round(H * 0.16), sMax = Math.round(H * 0.5);
    for (let s = sMin; s <= sMax; s += 2) for (let p = 0; p <= 16; p += 2) {
      const x = canto === 'dir' ? R - p - s : p, y = R - p - s;
      if (x < 0 || y < 0) continue;
      const score = pontuarQuadrado(S, x, y, s);
      if (score > melhor.score) melhor = { score, s, p, canto, x: ox + x, y: oy + y, lx: x, ly: y, S };
    }
  }
  if (melhor.score < 0) return null;
  // refina em volta do melhor, passo 1
  const { S, canto } = melhor;
  const ox = canto === 'dir' ? W - R : 0, oy = H - R;
  let fino = { ...melhor };
  for (let s = melhor.s - 3; s <= melhor.s + 3; s++) for (let p = Math.max(0, melhor.p - 2); p <= melhor.p + 2; p++) {
    const x = canto === 'dir' ? R - p - s : p, y = R - p - s;
    if (x < 0 || y < 0 || s < 8) continue;
    const score = pontuarQuadrado(S, x, y, s);
    if (score > fino.score) fino = { score, s, p, canto, x: ox + x, y: oy + y };
  }
  return { x: fino.x, y: fino.y, s: fino.s, canto, score: Math.round(fino.score * 100) / 100 };
}

/**
 * Anéis vermelhos: o ícone de inimigo tem borda vermelha. Contar pixels
 * vermelhos em células do tamanho de meio ícone dá, quase de graça, os
 * poucos lugares onde vale procurar quem não está sendo seguido. Ward e
 * ping também são vermelhos — a correlação depois separa.
 */
function manchasVermelhas(rgba, s, d, cor = 'vermelho') {
  const cel = Math.max(4, Math.round(d / 2)), nc = Math.ceil(s / cel), cont = new Uint16Array(nc * nc);
  const k = cor === 'azul' ? 'aliado' : 'inimigo';
  // a regra fixa continua valendo; a cor aprendida só ACRESCENTA (nunca tira) — assim o modo daltônico/tema não zera a leitura
  const fixa = cor === 'azul' ? (r, g, b) => b > 100 && b > r * 1.5 && b >= g * 1.1 : (r, g, b) => r > 100 && r > g * 1.5 && r > b * 1.2;
  const bate = corPronta(k) ? (r, g, b) => fixa(r, g, b) || distCor(r, g, b, cores[k]) < 40 : fixa;
  for (let y = 0; y < s; y += 2) for (let x = 0; x < s; x += 2) {
    const q = (y * s + x) * 4, r = rgba[q], g = rgba[q + 1], b = rgba[q + 2];
    if (bate(r, g, b)) cont[((y / cel) | 0) * nc + ((x / cel) | 0)]++;
  }
  const pontos = [];
  for (let j = 0; j < nc; j++) for (let i = 0; i < nc; i++) {
    // soma 2x2 de células (o anel cruza várias)
    const n = cont[j * nc + i] + (i + 1 < nc ? cont[j * nc + i + 1] : 0) + (j + 1 < nc ? cont[(j + 1) * nc + i] : 0) + (i + 1 < nc && j + 1 < nc ? cont[(j + 1) * nc + i + 1] : 0);
    if (n >= 8 && n <= 90) pontos.push({ x: (i + 1) * cel, y: (j + 1) * cel, n });   // centro do bloco 2x2 (cheio demais = rio, não anel)
  }
  // junta vizinhos
  const juntos = [];
  // anel de campeão tem ~24 pixels contados: os mais parecidos com isso primeiro (torre e ping ficam pro fim)
  for (const p of pontos.sort((a, b) => Math.abs(a.n - 24) - Math.abs(b.n - 24))) if (!juntos.some((q) => Math.abs(q.x - p.x) < d && Math.abs(q.y - p.y) < d)) juntos.push(p);
  return juntos.slice(0, 14);
}
const d0 = () => escala?.d ?? 24;

/**
 * Onde está a wave de cada lane: minions são pontinhos vermelhos/azuis ao
 * longo da lane. Mede, em cada lane, a posição média dos pontos de cada cor
 * (0 = ponta da base azul, 1 = ponta da base vermelha) e devolve a frente
 * (média das duas). Ignora ícones grandes (campeões, torres) pelo tamanho.
 */
const LANES_TRILHA = {
  top: [[0.10, 0.80], [0.10, 0.12], [0.85, 0.10]],
  mid: [[0.16, 0.84], [0.84, 0.16]],
  bot: [[0.15, 0.90], [0.88, 0.90], [0.90, 0.20]],
};
/**
 * Wards no minimapa (medido nas amostras reais): ward nossa = quadradinho
 * verde ~(75,150,72) com 8–12 px; control ward = rosa ~(153,94,140) com ~17 px;
 * Ward deles revelada seria um quadradinho vermelho, mas vermelho pequeno no
 * minimapa é minion, torre, ping… — sem amostra confirmada, fica de fora.
 * Plantas são amarelas: fora. Devolve posições normalizadas (0..1).
 */
function wards(rgba, s, icones) {
  const cel = 4, nc = Math.ceil(s / cel);
  const verde = new Uint16Array(nc * nc), rosa = new Uint16Array(nc * nc);
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const q = (y * s + x) * 4, r = rgba[q], g = rgba[q + 1], b = rgba[q + 2], i = ((y / cel) | 0) * nc + ((x / cel) | 0);
    if (g > 130 && r < 115 && b < 115 && g > r * 1.5 && g > b * 1.5) verde[i]++;
    else if (r > 135 && b > 110 && g < 120 && r > g * 1.3 && b > g * 1.15) rosa[i]++;
  }
  const k = (s / 321) ** 2;   // tamanhos medidos a 321 px
  const juntar = (cont, min, max) => {
    const pontos = [];
    for (let j = 0; j + 1 < nc; j++) for (let i = 0; i + 1 < nc; i++) {
      const n = cont[j * nc + i] + cont[j * nc + i + 1] + cont[(j + 1) * nc + i] + cont[(j + 1) * nc + i + 1];
      if (n < min * k || n > max * k) continue;
      // isolado: um ícone de campeão tem a cor espalhada em volta; a ward não
      let volta = 0; for (let jj = j - 2; jj <= j + 3; jj++) for (let ii = i - 2; ii <= i + 3; ii++) if (jj >= 0 && ii >= 0 && jj < nc && ii < nc) volta += cont[jj * nc + ii];
      if (volta > n * 1.6) continue;
      pontos.push({ x: (i + 1) * cel, y: (j + 1) * cel, n });
    }
    const out = [];
    for (const p of pontos.sort((a, b) => b.n - a.n)) if (!out.some((q) => Math.abs(q.x - p.x) < 12 && Math.abs(q.y - p.y) < 12)) out.push(p);
    return out;
  };
  const longeDeIcone = (p) => !icones.some((c) => Math.hypot(c.x * s - p.x, c.y * s - p.y) < c.d * 0.8);
  const norm = (p, tipo) => ({ x: Math.round(p.x / s * 1000) / 1000, y: Math.round(p.y / s * 1000) / 1000, tipo });
  return {
    nossas: [...juntar(verde, 5, 24).map((p) => norm(p, 'ward')), ...juntar(rosa, 12, 40).filter(longeDeIcone).map((p) => norm(p, 'control'))],
    deles: [],
  };
}
/**
 * Retângulo branco da câmera no minimapa (medido: 90×50 px a 321, linha de 2 px).
 * Com a câmera travada ele fica centrado em você — serve de posição sua quando
 * o seu ícone não é reconhecido. Devolve o centro normalizado ou null.
 */
function retanguloCamera(rgba, s) {
  const branco = (x, y) => { const q = (y * s + x) * 4; return rgba[q] > 185 && rgba[q + 1] > 185 && rgba[q + 2] > 185 && Math.abs(rgba[q] - rgba[q + 2]) < 35; };
  // linhas horizontais com uma sequência branca longa (≥ 0,2·s)
  const runs = [];
  for (let y = 0; y < s; y++) {
    let melhor = null, ini = -1;
    for (let x = 0; x <= s; x++) {
      const b = x < s && branco(x, y);
      if (b && ini < 0) ini = x;
      if (!b && ini >= 0) { if (x - ini >= s * 0.2 && (!melhor || x - ini > melhor.n)) melhor = { x1: ini, x2: x - 1, n: x - ini }; ini = -1; }
    }
    if (melhor) runs.push({ y, ...melhor });
  }
  if (runs.length < 2) return null;
  // par topo/base com distância parecida com a altura do retângulo (0,12–0,2·s) e mesma faixa em x
  for (let i = 0; i < runs.length; i++) for (let j = runs.length - 1; j > i; j--) {
    const a = runs[i], b = runs[j], h = b.y - a.y;
    if (h < s * 0.12 || h > s * 0.2) continue;
    if (Math.abs(a.x1 - b.x1) > 6 || Math.abs(a.x2 - b.x2) > 6) continue;
    return { x: (a.x1 + a.x2) / 2 / s, y: (a.y + b.y) / 2 / s, w: a.n / s, h: h / s };
  }
  // só uma borda horizontal visível (retângulo cortado pela beira do mapa): usa a largura e chuta a altura
  const a = runs[0];
  if (a.n >= s * 0.24) return { x: (a.x1 + a.x2) / 2 / s, y: Math.min(1, Math.max(0, (a.y + (a.y < s / 2 ? s * 0.078 : -s * 0.078)) / s)), w: a.n / s, h: 0.156, cortado: true };
  return null;
}
let camTravada = { ok: 0, n: 0 }, ultimaCam = null, placarAvisado = false, meuUltimo = null, ultimoPlacarEm = 0;
const ultimaVez = new Map();             // nome -> quando foi visto pela última vez (pra procurar o mapa todo menos)
let gradePlacar = null;                  // grade lembrada do placar: {xEsq, xDir, base, P, off, d} em meia-res — leitura rápida
const posAnterior = new Map();   // último lugar confirmado de cada ícone (pra ver pulo de flash)
// O que é vermelho/azul sempre no mesmo pixel é torre/inibidor, não minion: máscara temporal.
let fixoR = null, fixoA = null, fixoS = 0;
const FIXO_TETO = 30, FIXO_LIMIAR = 12;   // ~12 leituras seguidas (uns 25 s) no mesmo pixel = estrutura
function wavesPorLane(rgba, s, d) {
  if (fixoS !== s) { fixoR = new Uint8Array(s * s); fixoA = new Uint8Array(s * s); fixoS = s; }
  const ehRed = (r, g, b) => r > 120 && r > g * 1.7 && r > b * 1.5, ehAzul = (r, g, b) => b > 140 && b > r * 1.8 && b > g * 1.25 && g < 170;
  const raio = Math.max(3, Math.round(d * 0.25));
  // Máscara de ícones: célula de 6 px com muitos pixels coloridos é campeão/torre/ping, não minion.
  const cel = 6, nc = Math.ceil(s / cel), contR = new Uint16Array(nc * nc), contA = new Uint16Array(nc * nc);
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const q = (y * s + x) * 4, r = rgba[q], g = rgba[q + 1], b = rgba[q + 2];
    if (ehRed(r, g, b)) contR[((y / cel) | 0) * nc + ((x / cel) | 0)]++; else if (ehAzul(r, g, b)) contA[((y / cel) | 0) * nc + ((x / cel) | 0)]++;
  }
  const icone = (x, y) => { const i = ((y / cel) | 0) * nc + ((x / cel) | 0); return contR[i] + contA[i] >= 12; };
  const saida = {};
  for (const [lane, trilha] of Object.entries(LANES_TRILHA)) {
    // comprimento total pra parametrizar
    const segs = []; let total = 0;
    for (let i = 1; i < trilha.length; i++) { const L = Math.hypot(trilha[i][0] - trilha[i - 1][0], trilha[i][1] - trilha[i - 1][1]); segs.push(L); total += L; }
    let somaR = 0, nR = 0, somaA = 0, nA = 0, acum = 0;
    for (let i = 1; i < trilha.length; i++) {
      const [ax, ay] = trilha[i - 1], [bx, by] = trilha[i];
      const passos = Math.max(2, Math.round(segs[i - 1] * s / 2));
      for (let k = 0; k <= passos; k++) {

  const icone = async (nome, pt, cor) => {
    const img = await iconeDe(nome); if (!img) return;
    const cx = x0 + pt.x * s, cy = y0 + pt.y * s;
    c.save(); c.beginPath(); c.arc(cx, cy, d / 2, 0, Math.PI * 2); c.clip(); c.drawImage(img, cx - d / 2, cy - d / 2, d, d); c.restore();
    c.strokeStyle = cor; c.lineWidth = 2; c.beginPath(); c.arc(cx, cy, d / 2 - 1, 0, Math.PI * 2); c.stroke();
  };
  for (const [i, n] of FALSOS.inimigos.entries()) if (i !== 3) await icone(n, pos(i), '#e03030');   // Jinx "na fog"
  await icone(FALSOS.eu, { x: 0.3, y: 0.7 }, '#fff');
  c.fillStyle = '#e03030'; c.beginPath(); c.arc(x0 + s * 0.6, y0 + s * 0.4, 4, 0, Math.PI * 2); c.fill();   // ward
  ctxDe(falsa).drawImage(buf, 0, 0);
  return { s, d, pos };
}

/* ---------------------------------------------------------------- vai */
(async () => {
  porNome = new Map((await fetch('/api/campeoes').then((r) => r.json()).catch(() => [])).map((c) => [semAcento(c.nome), c.id]));
  if (SO_TELA) {
    telaFalsa(innerWidth, innerHeight); document.body.appendChild(falsa); falsa.style.position = 'fixed'; falsa.style.inset = '0';
    const t0 = Date.now(); setInterval(() => desenharFalsa(Date.now() - t0), 200);
    return;
  }
  await prepararMapa();
  await abrirCaptura();
  log(`captura ${W}x${H}${TESTE ? ' (teste)' : ''}`);
  if (TESTE || FINGIR) inimigos = FALSOS.inimigos.map((n) => ({ campeao: n, morto: false })), meuCampeao = FALSOS.eu;
  if (TESTE) {
    const t0 = Date.now();
    setInterval(async () => { const r = await desenharFalsa(Date.now() - t0); window.esperado = r; }, INTERVALO);
  } else if (AMOSTRA) {
    const meta = await fetch(AMOSTRA.replace(/\.png$/, '.json')).then((r) => r.json());
    meuCampeao = meta.eu; meuTime = (meta.jogadores ?? []).find((j) => j.campeao === meta.eu)?.time ?? 100;
    inimigos = (meta.jogadores ?? []).filter((j) => j.time !== meuTime).map((j) => ({ campeao: j.campeao, morto: !!j.morto, role: j.role }));
    aliados = (meta.jogadores ?? []).filter((j) => j.time === meuTime && j.campeao !== meuCampeao).map((j) => ({ campeao: j.campeao, morto: !!j.morto, role: j.role }));
    log(`amostra: eu ${meuCampeao}, ${inimigos.length} inimigos, ${aliados.length} aliados`);
  } else if (!FINGIR) { await lerPartida(); setInterval(lerPartida, 2000); }
  // Ritmo adaptável: quadro pesado (muitos ícones) → espera mais, pra não roubar CPU do jogo.
  let intervalo = INTERVALO;
  const laco = async () => {
    const t0 = performance.now();
    await quadro();
    const gasto = performance.now() - t0;
    intervalo = gasto > 80 ? Math.min(LEVE ? 900 : 500, intervalo + 40) : gasto < 35 ? Math.max(INTERVALO, intervalo - 10) : intervalo;
    setTimeout(laco, Math.max(20, intervalo - gasto));
  };
  laco();
})().catch((erro) => { log('falhou: ' + erro.message); if (!TESTE) fetch('/api/olho', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ erro: erro.message, t: Date.now() }) }).catch(() => {}); });
