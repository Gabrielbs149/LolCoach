<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>LolCoach — ao vivo</title>
<style>
:root{
  --f0:#070a0f; --f1:#0d131c; --f2:#131c27; --f3:#1a2534;
  --borda:#22303f; --borda-forte:#33455c;
  --texto:#e9f0f8; --fraco:#8ea0b5; --apagado:#5d6e84;
  --ouro:#c8aa6e; --ouro-claro:#f0d9a8; --ouro-escuro:#8a713f;
  --u3:#e05555; --u2:#e0a03f; --u1:#4d8fc4; --vit:#31b073; --der:#e05555;
  --r-s:4px; --r-m:6px;
  --e1:4px; --e2:8px; --e3:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--f0);color:var(--texto);overflow:hidden;
  font:13px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:#26323f;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ------------------------------------------------------------------ topo */
header{position:relative;display:flex;align-items:center;gap:11px;padding:10px 13px;
  background:var(--f2);background-size:cover;background-position:center 18%;
  border-bottom:1px solid var(--borda);flex:0 0 auto;overflow:hidden}
header::before{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,var(--f0) 26%,rgba(7,10,15,.9) 56%,rgba(7,10,15,.45))}
header>*{position:relative}
.relogio{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--ouro);letter-spacing:-.4px;line-height:1}
.relogio span{display:block;font-size:8.5px;letter-spacing:1px;text-transform:uppercase;
  color:var(--apagado);font-weight:600;margin-top:3px}
.meu{display:flex;align-items:center;gap:8px}
.meu img{width:32px;height:32px;border-radius:var(--r-m);border:1px solid var(--ouro);background:var(--f3)}
.meu .l1{font-weight:700;font-size:13.5px;letter-spacing:-.1px}
.meu .l2{color:var(--apagado);font-size:11px;margin-top:1px}
.vida{position:relative;flex:0 0 auto;height:3px;background:#2a1518}
.vida i{display:block;height:100%;background:linear-gradient(90deg,#248257,#3fce85);transition:width .3s}
.vida.baixa i{background:linear-gradient(90deg,#a33,#e05555)}
.numeros{margin-left:auto;display:flex;gap:14px;text-align:right}
.numeros div span{display:block;font-size:8.5px;text-transform:uppercase;
  letter-spacing:.9px;color:var(--apagado);font-weight:600}
.numeros div b{font-size:15px;font-variant-numeric:tabular-nums;font-weight:700;
  letter-spacing:-.3px;line-height:1.3}

/* ---- barra da voz: um player ---- */
.voz{display:flex;flex-direction:column;gap:0;background:linear-gradient(180deg,var(--f2),var(--f1));border-bottom:1px solid var(--borda);flex:0 0 auto}
.voz .linha{display:flex;align-items:center;gap:12px;padding:10px 14px}
.voz .play{width:46px;height:46px;border-radius:50%;border:2px solid var(--vit);background:radial-gradient(circle at 35% 35%,#2e6a4c,#153a29);color:#dff7ea;font-size:18px;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(49,176,115,.12);transition:transform .1s,box-shadow .2s;flex:0 0 auto}
.voz .play:hover{transform:scale(1.05)}
.voz .play.off{border-color:var(--der);background:radial-gradient(circle at 35% 35%,#6a2e2e,#3a1515);color:#fde3e3;box-shadow:0 0 0 4px rgba(224,85,85,.12)}
.voz .estado{display:flex;flex-direction:column;gap:2px;min-width:92px}
.voz .estado b{font-size:13px;color:var(--texto)} .voz .estado small{font-size:10.5px;color:var(--apagado)}
.voz .vol{display:flex;align-items:center;gap:8px;flex:1;min-width:140px}
.voz .vol i{font-style:normal;font-size:14px;color:var(--fraco);width:18px;text-align:center}
.voz .vol input[type=range]{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ouro) var(--pct,90%),var(--f3) var(--pct,90%));outline:none;cursor:pointer}
.voz .vol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ouro-claro);border:2px solid var(--f0);box-shadow:0 0 0 2px var(--ouro-escuro)}
.voz .vol em{font-style:normal;font-size:11px;color:var(--fraco);width:34px;text-align:right;font-variant-numeric:tabular-nums}
.voz .modo{display:flex;background:var(--f0);border:1px solid var(--borda);border-radius:999px;padding:2px}
.voz .modo button{background:transparent;border:0;color:var(--fraco);font:inherit;font-size:11px;padding:4px 10px;border-radius:999px;cursor:pointer}
.voz .modo button.on{background:var(--ouro-escuro);color:#fff7e6}
.voz .mini{background:transparent;border:1px solid var(--borda);color:var(--fraco);font:inherit;font-size:11px;padding:4px 9px;border-radius:var(--r-s);cursor:pointer}
.voz .mini.on{border-color:var(--ouro);color:var(--ouro-claro)}
.voz .modulos{display:none;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.voz .modulos.aberto{display:flex}
.voz .modulos button{background:var(--f2);border:1px solid var(--borda);color:var(--apagado);font:inherit;font-size:10.5px;padding:3px 9px;border-radius:999px;cursor:pointer}
.voz .modulos button.on{border-color:var(--ouro);color:var(--ouro-claro);background:#241f16}
.time .intel{font-size:10.5px;color:var(--apagado);padding:0 10px 6px 42px;line-height:1.4} .time .intel.forte{color:var(--u3)} .time .intel.fraco{color:var(--vit)}
.selecao{padding:14px}
.selecao h1{font-size:16px;margin:0 0 10px;color:var(--ouro-claro)}
.selecao .times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.selecao .lista{display:flex;flex-wrap:wrap;gap:6px}
.selecao .lista span{display:inline-flex;align-items:center;gap:6px;background:var(--f1);border:1px solid var(--borda);border-radius:var(--r-s);padding:3px 8px 3px 3px;font-size:12px}
.selecao .lista img{width:24px;height:24px;border-radius:var(--r-s)}
.selecao .sug{margin-top:12px;background:var(--f1);border:1px solid var(--ouro-escuro);border-radius:var(--r-m);padding:10px 12px}
.selecao .anMeta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px;font-size:11px;color:var(--fraco)} .selecao .anMeta span{background:var(--f2);border:1px solid var(--borda);border-radius:999px;padding:2px 8px} .selecao .anMeta .parcial{color:var(--u2);border-color:#5c4a22} .selecao .anMeta .completa{color:var(--vit)} .selecao .anMeta .aviso{color:var(--u3);border-color:#5c2226}
.selecao .cand.top{background:#1a1810;border:1px solid var(--ouro-escuro);border-radius:var(--r-s)}
.selecao .intel{border-color:#5c2226} .selecao .intel > b{display:flex;align-items:center;gap:8px} .selecao .intel > b small{color:var(--apagado);font-weight:400;text-transform:none;letter-spacing:0}
.selecao .cand.ameaca > span:first-child{color:var(--u3)} .selecao .cand .rota{font-style:normal;color:var(--apagado);font-size:10.5px;margin-left:4px}
.selecao .cand .vs i.dica{display:block;background:transparent;color:var(--apagado);padding:2px 0 0;white-space:normal}
.selecao .cand .vs i{display:inline-block;font-style:normal;margin:2px 6px 0 0;padding:1px 6px;border-radius:4px;background:var(--f2);color:var(--fraco);font-size:10.5px} .selecao .cand .vs i.v{color:var(--vit)} .selecao .cand .vs i.d{color:var(--der)}
.selecao .sug .cand{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;align-items:center;margin-top:6px;font-size:12.5px}
.selecao .sug .cand b{font-variant-numeric:tabular-nums}
.selecao .sug .cand .vs{display:flex;gap:6px;flex-wrap:wrap;color:var(--fraco);font-size:11px}
main{flex:1;overflow-y:auto;padding:11px}
/* Na segunda tela inteira: três colunas (avisos+objetivos | contra você | placar).
   Numa janela estreita, uma coluna só, na ordem. */
main.largo{display:grid;grid-template-columns:1fr;gap:14px;align-content:start}
main.largo .col{min-width:0}
main.largo .col h2.sec:first-child{margin-top:0}
@media (min-width:1100px){
  main.largo{grid-template-columns:1.1fr 1.3fr 1fr;padding:16px 18px}
  body{font-size:14px}
  .relogio{font-size:26px}
}
h2.sec{display:flex;align-items:center;gap:9px;font-size:10px;text-transform:uppercase;
  letter-spacing:.9px;color:var(--apagado);font-weight:700;margin:var(--e3) 0 var(--e2)}
h2.sec:first-child{margin-top:0}
h2.sec::after{content:"";flex:1;height:1px;background:var(--borda)}

/* -------------------------------------------------------------- conselhos */
.conselho{background:var(--f1);border:1px solid var(--borda);border-left:3px solid var(--u1);
  border-radius:0 var(--r-m) var(--r-m) 0;padding:9px 12px;margin-bottom:var(--e1)}
.conselho.u3{border-left-color:var(--u3);background:#1c1315}
.conselho.u2{border-left-color:var(--u2);background:#1b1710}
.conselho .cab{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.conselho h3{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.15px}
.conselho p{margin:4px 0 0;color:#bcccdd;font-size:11.5px;line-height:1.5}
.etiqueta{font-size:8.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  border-radius:var(--r-s);padding:2px 6px;border:1px solid var(--borda);color:var(--apagado)}
.conselho.u3 .etiqueta{color:var(--u3);border-color:#5c2226;background:#2a1517}
.conselho.u2 .etiqueta{color:var(--u2);border-color:#5c4522;background:#2a2115}
.calmo{background:var(--f1);border:1px solid var(--borda);border-radius:var(--r-m);
  padding:12px;text-align:center;color:var(--apagado);font-size:11.5px}
.calmo b{display:block;color:var(--fraco);font-size:12.5px;font-weight:650;margin-bottom:2px}

/* ---------------------------------------------------------- contra você */
.contra{background:var(--f1);border:1px solid var(--borda);border-radius:var(--r-m);
  padding:10px 12px;margin-bottom:var(--e2)}
.contra.lane{border-left:3px solid var(--der)}
.contra.jungle{border-left:3px solid var(--u2)}
.contra .cab{display:flex;align-items:center;gap:9px}
.contra .cab img{width:30px;height:30px;border-radius:var(--r-s);background:var(--f3);border:1px solid var(--borda)}
.contra .cab b{font-size:13.5px;font-weight:700}
.contra .cab .papel{font-size:10px;color:var(--apagado);text-transform:uppercase;letter-spacing:.7px}
.contra .cab .numero{margin-left:auto;text-align:right;font-size:11px;color:var(--apagado);line-height:1.35}
.contra .cab .numero b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.contra .texto{font-size:11.5px;color:#bcccdd;margin-top:6px;line-height:1.5}
.contra .texto b{color:var(--texto)}
.contra .texto .d{color:var(--der)} .contra .texto .v{color:var(--vit)}
.contra .rotulo{margin-top:7px;color:var(--apagado);font-size:10px;text-transform:uppercase;letter-spacing:.7px}
.hab{display:flex;flex-wrap:wrap;gap:var(--e1);margin-top:7px}
.hab span{display:inline-flex;align-items:center;gap:6px;background:var(--f0);border:1px solid var(--borda);
  border-radius:var(--r-s);padding:3px 8px 3px 4px;font-size:11px}
.hab span i{font-style:normal;width:18px;height:18px;line-height:17px;text-align:center;
  border:1px solid var(--ouro);border-radius:var(--r-s);color:var(--ouro);font-weight:800;font-size:10px}
.hab span b{font-weight:700}
.hab span em{font-style:normal;color:var(--apagado);font-size:10.5px}
.contra ul{margin:6px 0 0;padding-left:16px;color:#a9b8c9;font-size:11px;line-height:1.5}
.contra ul li{margin-bottom:2px}
.montando{color:var(--apagado);font-size:11px;padding:8px 12px;background:var(--f1);
  border:1px solid var(--borda);border-radius:var(--r-m)}

/* ---------------------------------------------------------- onde estão */
.objetivos{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.obj{background:var(--f1);border:1px solid var(--borda);border-radius:var(--r-m);padding:8px 10px}
.obj b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--apagado)}
.obj span{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.obj.vivo span{color:var(--ouro)}
.obj i{display:block;font-style:normal;font-size:10.5px;color:var(--apagado)}
.linha .flash{margin-left:6px;white-space:nowrap;background:var(--f2);border:1px solid var(--borda-forte);color:var(--fraco);font:inherit;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:var(--r-s);cursor:pointer;font-variant-numeric:tabular-nums}
.linha .flash:hover{border-color:var(--ouro);color:var(--ouro-claro)}
.linha .flash.usado{background:#3a1618;border-color:#5c2226;color:#f07a7a}
.linha .flash.voltou{background:#123a28;border-color:#1e5c40;color:#4ed093}
.linha .visto{margin-left:6px;font-size:10px;color:var(--apagado);font-weight:500}
.situs{display:flex;flex-direction:column;gap:3px}
.situ{display:flex;gap:8px;font-size:12px;color:var(--texto);padding:4px 8px;background:var(--f1);border:1px solid var(--borda);border-radius:var(--r-s)}
.situ span{color:var(--apagado);font-variant-numeric:tabular-nums}
.situ.quieta{color:var(--apagado)} .situ.p3{border-color:#5c2226}
.resumoFim{margin-top:18px;text-align:left;font-size:12px;color:var(--texto);background:var(--f1);border:1px solid var(--borda);border-radius:var(--r-s);padding:8px 12px;line-height:1.7} .resumoFim b{display:block;margin-bottom:2px} .resumoFim .dica{color:var(--apagado);font-size:11px} .resumoFim details{margin-top:6px} .resumoFim summary{cursor:pointer;color:var(--apagado);font-size:11px} .resumoFim .situs{display:flex;flex-direction:column;gap:3px;margin-top:6px;max-height:260px;overflow:auto}
.situ .aval{margin-left:auto;display:flex;gap:6px;font-weight:normal} .situ .aval i{cursor:pointer;font-style:normal;opacity:.45;filter:grayscale(1)} .situ .aval i:hover{opacity:1;filter:none} .situ .aval.bom i[data-n="1"],.situ .aval.ruim i[data-n="-1"]{opacity:1;filter:none}
.linha .visto.agora{color:var(--ouro-claro)}
.time h3 small{font-weight:400;color:var(--apagado);font-size:9.5px;text-transform:none;letter-spacing:0;margin-left:6px}
.jgLinha{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--borda);font-size:12px;color:var(--fraco)}
.jgLinha b{color:var(--ouro-claro)} .jgLinha .ha{margin-left:auto;font-variant-numeric:tabular-nums}
.jgLinha.sumido{background:rgba(224,160,63,.08)} .jgLinha.perigo{background:rgba(240,122,122,.12)}
.vistos{background:var(--f1);border:1px solid var(--borda);border-radius:var(--r-m);overflow:hidden}
.visto{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:8px;
  padding:5px 10px;border-bottom:1px solid #161f2b;font-size:11.5px}
.visto:last-child{border-bottom:0}
.visto img{width:24px;height:24px;border-radius:var(--r-s);background:var(--f3)}
.visto .q{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visto .q b{font-weight:650}
.visto .q span{color:var(--apagado);font-size:10.5px;margin-left:5px}
.visto .q em{display:block;font-style:normal;color:#a9b8c9;font-size:10.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visto .ha{font-variant-numeric:tabular-nums;font-size:11px;color:var(--fraco);white-space:nowrap;text-align:right}
.visto .ha.morto{color:var(--vit)}
.visto .ha.velho{color:var(--apagado)}
.visto .ha.fresco{color:var(--u2);font-weight:700}
.visto.jungle{background:#161a10}
.visto.jungle .q b{color:var(--u2)}

/* ---------------------------------------------------------------- placar */
.placar{display:grid;grid-template-columns:1fr 1fr;gap:var(--e2)}
.time{background:var(--f1);border:1px solid var(--borda);border-radius:var(--r-m);overflow:hidden}
.time h3{margin:0;font-size:8.5px;text-transform:uppercase;letter-spacing:.9px;
  color:var(--apagado);font-weight:700;padding:5px 10px;background:var(--f0);
  border-bottom:1px solid var(--borda)}
.time.deles h3{color:#c98a8a}
.linha{display:grid;grid-template-columns:22px minmax(0,1fr) 58px 46px auto;align-items:center;
  gap:7px;padding:4px 10px;font-size:11.5px;border-bottom:1px solid #161f2b}
.linha:last-child{border-bottom:0}
.linha img{width:22px;height:22px;border-radius:var(--r-s);background:var(--f3)}
.linha .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.linha .kda{font-variant-numeric:tabular-nums;color:var(--fraco);font-size:11px;text-align:right}
.linha .cs{font-variant-numeric:tabular-nums;color:var(--apagado);text-align:right;font-size:11px}
.linha.morto{opacity:.38}
.linha.morto .n::after{content:" ✕";color:var(--u3)}
.linha.eu{background:#1b2534}
.linha.eu .n{color:var(--ouro)}

.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;text-align:center;gap:11px;padding:24px}
.vazio .anel{width:46px;height:46px;border-radius:50%;border:2px solid var(--borda);
  border-top-color:var(--ouro);animation:gira 2.4s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.vazio b{color:var(--texto);font-size:14px;font-weight:650}
.vazio p{margin:0;color:var(--apagado);font-size:11.5px;max-width:270px;line-height:1.55}
.vazio ul{margin:4px 0 0;padding:0;list-style:none;color:var(--apagado);font-size:11px;text-align:left;line-height:1.85}
.vazio ul li::before{content:"→ ";color:var(--ouro)}
.aviso{color:var(--apagado);font-size:10px;text-align:center;margin-top:var(--e3);
  line-height:1.6;border-top:1px solid var(--borda);padding-top:10px}
.linha .fx{font-size:.78em;color:var(--vit,#9c6);margin-left:6px;opacity:.9}
</style>
</head>
<body>
<div class="voz" id="voz">
  <div class="linha">
    <button class="play" id="vozLiga" onclick="vozAlternar()" title="parar / voltar a ouvir">■</button>
    <div class="estado"><b id="vozEstado">Ouvindo</b><small id="vozSub">a voz fala na partida</small></div>
    <div class="vol"><i id="vozIcone">🔊</i><input type="range" min="0" max="1" step="0.05" id="vozVolume" title="volume" oninput="vozVolumeMudar(this.value)"><em id="vozPct">90%</em></div>
    <div class="modo"><button id="modoSerio" onclick="vozModo('serio')">Sério</button><button id="modoDiv" onclick="vozModo('divertido')">Divertido</button></div>
    <button class="mini" id="vozFiltros" onclick="vozFiltros()" title="o que a voz fala">Filtros ▾</button>
    <button class="mini" onclick="falar('Voz do LolCoach ligada.', true)" title="ouvir um teste">testar</button>
  </div>
  <div class="modulos" id="vozModulos"></div>
</div>
<div id="tudo" style="display:flex;flex-direction:column;height:100%">
  <div class="vazio"><div class="anel"></div><b>Esperando a partida</b>
    <p>acende sozinha quando o jogo carregar</p></div>
</div>

<script>
const $ = (s) => document.querySelector(s);

/* ------------------------------------------------------------- voz */
/**
 * Fala com a voz do Windows (SpeechSynthesis, pt-BR). Como o Discord: som,
 * nunca tela por cima do jogo. Preferências ficam neste PC (localStorage).
 */
const MODULOS = [['timers','Timers'],['flash','Flash'],['kills','Kills e mortes'],['jungler','Jungler'],['spikes','Itens e nível'],['economia','Gold'],['lane','Lane'],['mapa','Mapa'],['selecao','Seleção']];
let voz = { ligada: true, modo: 'serio', volume: 0.9, modulos: Object.fromEntries(MODULOS.map(([k]) => [k, true])) };
try { voz = { ...voz, ...JSON.parse(localStorage.getItem('voz') ?? '{}') }; } catch {}
const vozSalvar = () => { try { localStorage.setItem('voz', JSON.stringify(voz)); } catch {} };
let vozPt = null;
function acharVoz(){
  const vs = speechSynthesis.getVoices();
  vozPt = vs.find(v => /pt[-_]BR/i.test(v.lang) && /natural|neural|online/i.test(v.name)) ?? vs.find(v => /pt[-_]BR/i.test(v.lang)) ?? vs.find(v => /^pt/i.test(v.lang)) ?? null;
}
if ('speechSynthesis' in window) { acharVoz(); speechSynthesis.onvoiceschanged = acharVoz; }
const filaFalas = [];
// Motor de voz vem da Configuração: 'edge' toca o mp3 neural do daemon; 'windows' usa a voz do sistema.
let motorVoz = 'edge';
const lerMotor = () => fetch('/api/config').then(r => r.json()).then(c => { const m = c?.voz?.motor === 'windows' ? 'windows' : 'edge'; if (m === 'edge' && errosSeguidos >= 4) return; motorVoz = m; }).catch(() => {});
lerMotor(); setInterval(lerMotor, 60000);
const filaMp3 = []; let tocando = null;
let errosSeguidos = 0;
function tocarProxima(){
  if (tocando || !filaMp3.length) return;
  const { texto, em } = filaMp3.shift();
  if (em && Date.now() - em > 8000) { tocarProxima(); return; }   // fala velha demais: não vale mais
  const a = new Audio('/api/voz/falar?texto=' + encodeURIComponent(texto));
  a.volume = voz.volume; tocando = a;
  const fim = () => { tocando = null; tocarProxima(); };
  // Falhou a nuvem: pula a fala (não mistura voz do Windows no meio). Só depois de 4 falhas seguidas troca de vez pro Windows.
  const falhou = () => { fim(); if (++errosSeguidos >= 4 && motorVoz === 'edge') { motorVoz = 'windows'; falarWindows(texto); } };
  a.onended = () => { errosSeguidos = 0; fim(); };
  a.onerror = falhou;
  a.play().catch(falhou);
}
// Urgente (prioridade 3) fura a fila: vai pra frente e corta o que está tocando.
function falar(texto, forcar = false, prioridade = 1){
  if ((!voz.ligada && !forcar) || !texto) return;
  if (motorVoz === 'edge') {
    if (prioridade >= 3) { filaMp3.length = 0; filaMp3.push({ texto, em: Date.now() }); if (tocando) { try { tocando.pause(); } catch {} tocando = null; } tocarProxima(); return; }
    if (filaMp3.length >= 3) filaMp3.shift();
    filaMp3.push({ texto, em: Date.now() }); tocarProxima();
    return;
  }
  if (prioridade >= 3 && 'speechSynthesis' in window) { speechSynthesis.cancel(); filaFalas.length = 0; }
  falarWindows(texto);
}
function falarWindows(texto){
  if (!('speechSynthesis' in window) || !texto) return;
  const u = new SpeechSynthesisUtterance(texto);
  if (vozPt) u.voice = vozPt;
  u.lang = 'pt-BR'; u.rate = 1.05; u.volume = voz.volume;
  // Não deixa acumular: se já tem 3 na fila, a mais velha cai.
  if (speechSynthesis.pending && filaFalas.length >= 3) { speechSynthesis.cancel(); filaFalas.length = 0; }
  filaFalas.push(u); u.onend = () => { const i = filaFalas.indexOf(u); if (i >= 0) filaFalas.splice(i, 1); };
  speechSynthesis.speak(u);
}
function vozAlternar(){ voz.ligada = !voz.ligada; if(!voz.ligada){ speechSynthesis.cancel(); filaMp3.length = 0; tocando?.pause(); tocando = null; } vozSalvar(); desenharVoz(); }
function vozModo(m){ voz.modo = m; vozSalvar(); desenharVoz(); falar(m === 'serio' ? 'Modo sério.' : 'Modo divertido ligado. Bora zoar.', true); }

function vozModulo(k){ voz.modulos[k] = !voz.modulos[k]; vozSalvar(); desenharVoz(); }
function vozFiltros(){ $('#vozModulos').classList.toggle('aberto'); $('#vozFiltros').classList.toggle('on', $('#vozModulos').classList.contains('aberto')); }
function desenharVoz(){

  liga.title = voz.ligada ? 'parar de ouvir' : 'voltar a ouvir';

  $('#vozPct').textContent = pct + '%';
  $('#vozVolume').style.setProperty('--pct', pct + '%');
  $('#vozIcone').textContent = !voz.ligada || pct === 0 ? '🔇' : pct < 40 ? '🔈' : pct < 75 ? '🔉' : '🔊';
  const desligados = MODULOS.filter(([k]) => !voz.modulos[k]).length;
  $('#vozFiltros').textContent = desligados ? `Filtros (${desligados} off) ▾` : 'Filtros ▾';
  $('#modoSerio').classList.toggle('on', voz.modo === 'serio');
  $('#modoDiv').classList.toggle('on', voz.modo === 'divertido');
  $('#vozVolume').value = voz.volume;
  $('#vozModulos').innerHTML = MODULOS.map(([k, nome]) => `<button class="${voz.modulos[k] ? 'on' : ''}" onclick="vozModulo('${k}')">${nome}</button>`).join('');
}

function falarNovas(falas){
  for (const f of falas ?? []) {
    if (f.seq <= ultimaFalaSeq) continue;
    ultimaFalaSeq = f.seq;
    if (!voz.modulos[f.modulo]) continue;
    falar(voz.modo === 'divertido' ? f.divertido : f.serio, false, f.prioridade ?? 1);
  }
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = (s) => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.round(s%60)).padStart(2,'0')}`;

function jgLinhaVivo(d){
  const jg = (d.inimigos ?? []).find(j => j.role === 'jungle'); if (!jg) return '';
  const v = jg.visto; const L = { top: 'top', mid: 'mid', bot: 'bot', jungle: 'jungle', rio: 'rio', barao: 'barão', dragao: 'dragão', base: 'base' };
  if (jg.morto) return `<div class="jgLinha">${icone(jg.campeao)}<span>Jungler deles <b>morto</b></span></div>`;
  if (!v) return `<div class="jgLinha">${icone(jg.campeao)}<span>Jungler deles <b>não visto</b></span></div>`;
  const cls = v.ha <= 3 ? (v.lado === 'nosso' ? 'perigo' : '') : v.ha >= 20 ? 'sumido' : '';
  return `<div class="jgLinha ${cls}">${icone(jg.campeao)}<span>Jungler deles <b>${esc(L[v.lane] ?? v.lane)}${v.lado === 'deles' ? ' deles' : v.lado === 'nosso' ? ' nosso' : ''}</b></span><span class="ha">${v.ha <= 3 ? 'agora' : 'há ' + v.ha + 's'}</span></div>`;
}

/** A ficha de um adversário: seu histórico contra ele, o que dele te mata, e como jogar. */
function fichaContra(f, eu){
  const h = f.historico;
  const tipo = f.ehMinhaLane ? 'lane' : 'jungle';
  const papel = f.ehMinhaLane ? 'sua lane' : 'jungler deles';

  const placar = h
    ? `<div class="numero"><b class="${h.taxa>=.5?'v':'d'}">${Math.round(h.taxa*100)}%</b>${h.jogos} jogos seus</div>`
    : (f.opgg ? `<div class="numero"><b>${f.opgg.taxa}%</b>op.gg, ${num(f.opgg.jogos)} jogos</div>` : '');

  const linhas = [];
  if (h && h.jogos >= 3) {
    linhas.push(`Você morre <b>${h.mortesPorJogo.toFixed(1)}×</b> por jogo contra ele${
      h.zona ? `, mais no <b>${esc(h.zona.nome)}</b>` : ''}${
      h.faixa ? `, entre <b>${esc(h.faixa.nome)} min</b>` : ''}.`);
    if (h.fatiaDoDano >= 0.25)
      linhas.push(`Ele fez <b class="d">${Math.round(h.fatiaDoDano*100)}%</b> do dano nas suas mortes — é ele quem te mata, não o time.`);
  }
  if (f.exato) linhas.push(`Com ${esc(eu.campeao)} especificamente: <b>${Math.round(f.exato.taxa*100)}%</b> em ${f.exato.jogos}.`);
  if (f.opgg && h) linhas.push(`No op.gg esse confronto dá <b>${f.opgg.taxa}%</b> pra você (${num(f.opgg.jogos)} jogos).`);

  const hab = f.habilidades.length
    ? `<div class="hab">${f.habilidades.map(x => `<span><i>${x.tecla}</i><b>${x.fatia}%</b>
        <em>${esc(x.nome ?? '')}${x.recarga ? ` · ${x.recarga}s` : ''}</em></span>`).join('')}
        ${f.autosFatia >= 35 ? `<span><i>A</i><b>${f.autosFatia}%</b><em>autos</em></span>` : ''}</div>`
    : '';

  const dicas = f.dicas.length ? `<ul>${f.dicas.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : '';

  return `<div class="contra ${tipo}">
    <div class="cab">${icone(f.campeao, f.championId)}
      <div><b>${esc(f.campeao)}</b><div class="papel">${papel}</div></div>${placar}</div>
    ${linhas.length ? `<div class="texto">${linhas.join(' ')}</div>` : ''}
    ${hab ? `<div class="rotulo">O que dele te mata</div>${hab}` : ''}
    ${dicas}</div>`;
}

        <div class="l2">nível ${eu.nivel}${eu.role ? ' · ' + esc(eu.role) : ''}</div></div></div>
      <div class="numeros">
        <div><span>KDA</span><b>${eu.kills}/${eu.mortes}/${eu.assists}</b></div>
        <div><span>Farm</span><b>${eu.cs}</b></div>
        <div><span>Gold</span><b>${num(eu.ouro)}</b></div></div>
    </header>
    ${vidaPct !== null ? `<div class="vida ${vidaPct < 35 ? 'baixa' : ''}"><i style="width:${vidaPct}%"></i></div>` : ''}
    <main class="largo">
      <div class="col">
      ${d.conselhos.length
        ? d.conselhos.slice(0, 4).map(c => `<div class="conselho u${c.urgencia}">
            <div class="cab"><h3>${esc(c.titulo)}</h3><span class="etiqueta">${URGENTE[c.urgencia] ?? ''}</span>
              ${c.exato === false ? '<span class="etiqueta">estimado</span>' : ''}</div>
            <p>${esc(c.acao)}</p></div>`).join('')
        : `<div class="calmo"><b>Nada urgente agora</b>Farme e mantenha visão.</div>`}

      <h2 class="sec">Objetivos</h2>
      <div class="objetivos">${(d.objetivos ?? []).map(o => `<div class="obj ${o.vivo?'vivo':''}"><b>${esc(o.nome)}</b><span>${esc(o.quando)}</span><i>${esc(o.detalhe)}</i></div>`).join('')}</div>

      <h2 class="sec">Onde estão</h2>
      <div class="vistos">${vistos}</div>
      ${(d.situacoes ?? []).length ? `<h2 class="sec">Minimapa</h2><div class="situs">${d.situacoes.slice().reverse().map(s => `<div class="situ ${s.falada ? '' : 'quieta'} p${s.prioridade}"><span>${mmss(s.t)}</span>${esc(s.texto)}${s.falada ? `<b class="aval ${(avaliadas.get(`${s.t}|${s.chave}`) ?? s.aval) === 1 ? 'bom' : (avaliadas.get(`${s.t}|${s.chave}`) ?? s.aval) === -1 ? 'ruim' : ''}" data-k="${esc(`${s.t}|${s.chave}`)}"><i data-n="1" title="boa">👍</i><i data-n="-1" title="lixo">👎</i></b>` : ''}</div>`).join('')}</div>` : ''}
      </div>

      <div class="col">
      <h2 class="sec">Contra você</h2>
      ${d.contra?.length ? d.contra.map(f => fichaContra(f, eu)).join('')
        : '<div class="montando">montando as fichas dos adversários…</div>'}
      </div>

      <div class="col">
      <h2 class="sec">Placar</h2>
      <div class="placar">
        <div class="time"><h3>Seu time</h3>${meuTime.map(j => linhaJogador(j, j.souEu)).join('')}</div>
        <div class="time deles"><h3>Inimigos <small>F = flash usado</small></h3>${jgLinhaVivo(d)}${deles.map((j, i) => linhaJogador({ ...j, visto: (d.inimigos ?? []).find(x => x.campeao === j.campeao)?.visto ?? null, feiticoEm: (d.inimigos ?? []).find(x => x.campeao === j.campeao)?.feiticoEm ?? null }, false, i + 1, (d.flashes ?? []).find(f => f.campeao === j.campeao) ?? null, d.intelDeles?.[j.nome] ?? null)).join('')}</div>
      </div>

      </div>
    </main>`;
}

// Redesenha só quando algo mudou: reescrever o DOM inteiro a cada 2s com o
// jogo rodando é trabalho de GPU que o jogo prefere ter pra ele.
let ultimoJson = '';
async function tick(){
  if (document.visibilityState !== 'visible') return;
  try {
    const d = await fetch('/api/vivo').then(r => r.json());
    const json = JSON.stringify(d);
    if (json === ultimoJson) return;
    ultimoJson = json;
    desenhar(d);
    if (d.emJogo) { pastaSituAtual = d.pastaSitu ?? pastaSituAtual; } ultimoDado = d;
    ajustarRitmo(!!d.emJogo);
  } catch { /* painel caiu; a próxima tentativa resolve */ }
}
tick();
// em jogo, 700 ms: fala urgente não pode esperar 2 s
let ritmo = null;
function ajustarRitmo(emJogo){ const ms = emJogo ? 700 : 2000; if (ritmo?.ms === ms) return; if (ritmo) clearInterval(ritmo.id); ritmo = { ms, id: setInterval(tick, ms) }; }
ajustarRitmo(false);
document.addEventListener('visibilitychange', tick);
</script>
</body>
</html>
