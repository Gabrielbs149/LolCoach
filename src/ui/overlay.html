<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>LolCoach — overlay</title>
<style>
/* Janela transparente, sempre por cima, sem clique nem foco. Um painel de
   HUD: relógio e placar em cima, objetivos, os cinco inimigos com a tecla
   que marca o flash de cada um, e a última fala da voz. */
:root{--ouro:#c8aa6e;--ouro-claro:#f0d9a8;--texto:#f2f6fa;--fraco:#aab8c6;--apagado:#7a8a9a;--vit:#4ed093;--der:#f07a7a;--g2:#e0a03f;--fundo:rgba(6,9,14,.82)}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden}
body{font:12.5px/1.3 "Segoe UI",system-ui,sans-serif;color:var(--texto);-webkit-font-smoothing:antialiased;padding:4px}
body.ajuste .hud{outline:2px dashed var(--ouro-claro);outline-offset:2px}
.ajusteBarra{display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(200,170,110,.25);border-bottom:1px solid rgba(200,170,110,.5);font-size:12px}
.ajusteBarra .pega{flex:1;cursor:move;user-select:none;font-weight:700}
.ajusteBarra button{background:var(--fundo);color:var(--texto);border:1px solid rgba(200,170,110,.6);border-radius:4px;padding:2px 8px;cursor:pointer;font-weight:700}
.ajusteBarra button.ok{background:var(--ouro-claro);color:#111}
.canto{position:fixed;right:6px;bottom:6px;cursor:nwse-resize;color:var(--ouro-claro);font-size:18px;user-select:none}
.hud{width:332px;background:var(--fundo);border:1px solid rgba(200,170,110,.5);border-radius:8px;overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.55);text-shadow:0 1px 1px rgba(0,0,0,.8)}
.hud.oculto{display:none}
.topo{display:flex;align-items:center;gap:10px;padding:7px 10px;background:linear-gradient(90deg,rgba(200,170,110,.18),transparent);border-bottom:1px solid rgba(255,255,255,.08)}
.topo img{width:26px;height:26px;border-radius:5px;border:1px solid var(--ouro)}
.topo .t{font-size:17px;font-weight:800;color:var(--ouro-claro);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.topo .kda{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.topo .kda span{color:var(--fraco);font-weight:500;font-size:11px;margin-left:5px}
.objs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid rgba(255,255,255,.08)}
.obj{padding:6px 8px;border-right:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:7px}
.obj:last-child{border-right:0}
.obj i{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.obj.dragao i{background:#e0a03f} .obj.arauto i{background:#a970d8} .obj.barao i{background:#c8aa6e}
.obj b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--apagado);font-weight:700}
.obj span{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.obj.vivo span{color:var(--ouro-claro)} .obj.perto span{color:var(--g2)}
.jg{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px}
.jg img{width:20px;height:20px;border-radius:50%;border:1px solid var(--der)}
.jg b{color:var(--ouro-claro)} .jg .ha{margin-left:auto;color:var(--fraco);font-variant-numeric:tabular-nums}
.jg.sumido{background:rgba(224,160,63,.10)} .jg.sumido .ha{color:var(--g2)} .jg.perigo{background:rgba(240,122,122,.14)}
.cab{display:flex;align-items:center;justify-content:space-between;padding:5px 10px 2px;font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--apagado);font-weight:700}
.ini{display:grid;grid-template-columns:22px 1fr auto 70px;align-items:center;gap:7px;padding:3px 10px}
.ini img{width:22px;height:22px;border-radius:4px;background:#1a2230}
.ini.morto img{filter:grayscale(1);opacity:.5}
.ini .n{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ini .n small{color:var(--apagado);font-weight:500;margin-left:4px}
.ini .n .v{font-style:normal;font-size:10.5px;color:var(--fraco);margin-left:6px;font-variant-numeric:tabular-nums}
.ini .n .v.agora{color:var(--ouro-claro);font-weight:700}
.ini kbd{font:700 10px/1 "Segoe UI",system-ui;color:var(--fraco);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:2px 5px;white-space:nowrap}
.ini .f{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:12px}
.ini .f .bar{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:3px;overflow:hidden}
.ini .f .bar i{display:block;height:100%;background:var(--der)}
.ini .f.usado{color:var(--der)} .ini .f.voltou{color:var(--vit)} .ini .f.livre{color:var(--apagado);font-weight:500}
.fala{display:flex;gap:8px;align-items:flex-start;padding:7px 10px 8px;margin-top:3px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:var(--texto)}
.fala::before{content:"🔊";font-size:12px;opacity:.8}
.fala.u3{color:var(--der)} .fala.u2{color:var(--g2)}
.f .fx{display:block;font-size:.72em;opacity:.8;margin-top:1px}
.radar{position:relative;width:118px;height:118px;}.radar.p{width:90px;height:90px}.radar.g{width:170px;height:170px}.radar{margin:4px 10px 2px auto;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}.radar img{width:100%;height:100%;display:block;opacity:.75}.radar .pt{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;line-height:1}.radar .pt i{font-style:normal;font-size:8px;font-weight:700;color:#fff;background:rgba(190,40,40,.85);border-radius:8px;padding:1px 3px;border:1px solid rgba(255,255,255,.5)}.radar .pt.agora i{background:rgba(230,50,50,1);box-shadow:0 0 6px rgba(255,80,80,.9)}.radar .pt.velho i{opacity:.45}.radar .pt.morto i{background:rgba(90,90,90,.8)}.radar .pt b{font-size:8px;color:#ffd166;text-shadow:0 0 2px #000;margin-top:1px}.radar .pt.nosso i{background:rgba(40,110,200,.8)}.radar .pt.eu i{background:rgba(30,170,170,.95)}
</style>
</head>
<body>
<div class="hud oculto" id="hud"></div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = (s) => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const tecla = (a) => String(a ?? '').replace('Control', 'Ctrl').replace(/^num(\d)$/, 'Num $1');
let porNome = new Map(), ultimaFala = null, ultimaFalaEm = 0, ultimoJson = '';
fetch('/api/campeoes').then(r => r.json()).then(l => { porNome = new Map(l.map(c => [c.nome.toLowerCase().replace(/[^a-z]/g,''), c.id])); }).catch(() => {});
const icone = (nome) => { const id = porNome.get(String(nome ?? '').toLowerCase().replace(/[^a-z]/g,'')); return id ? `<img src="/icone/${id}" alt="">` : '<span></span>'; };
const CLS = { 'Dragão': 'dragao', 'Arauto': 'arauto', 'Barão': 'barao' };
const LUGAR = { top: 'top', mid: 'mid', bot: 'bot', jungle: 'jg', rio: 'rio', barao: 'barão', dragao: 'dragão', base: 'base' };
const visto = (v) => !v || v.ha >= 90 ? '' : v.ha <= 3 ? `<em class="v agora">${LUGAR[v.lane] ?? v.lane}${v.lado === 'deles' ? ' deles' : ''}</em>` : `<em class="v">${LUGAR[v.lane] ?? v.lane} ${v.ha}s</em>`;

/* Radar: o minimapa em miniatura com o último lugar de cada um deles (some depois de 90 s) e o flash em cima do ponto. */
function radar(d){
  const tam = d.overlayRadar ?? 'm';
  if (tam === 'off') return '';
  const pontos = (d.inimigos ?? []).filter(j => j.visto && j.visto.x != null && j.visto.ha < 90);
  const nossos = d.radarNossos ?? [];
  if (!pontos.length && !nossos.length) return '';
  return `<div class="radar ${tam}"><img src="/minimapa.png" alt="">${nossos.map(a => `<span class="pt nosso ${a.eu ? 'eu' : ''}" style="left:${(a.x * 100).toFixed(1)}%;top:${(a.y * 100).toFixed(1)}%"><i>${a.eu ? 'EU' : esc(String(a.campeao).slice(0, 3))}</i></span>`).join('')}${pontos.map(j => {
    const f = j.flashMarcado && j.flashEm > 0 ? mmss(j.flashEm) : '';
    return `<span class="pt ${j.morto ? 'morto' : j.visto.ha <= 5 ? 'agora' : j.visto.ha > 30 ? 'velho' : ''}" style="left:${(j.visto.x * 100).toFixed(1)}%;top:${(j.visto.y * 100).toFixed(1)}%"><i>${esc(j.campeao.slice(0, 3))}</i>${f ? `<b>${f}</b>` : ''}</span>`;
  }).join('')}</div>`;
}
/* Linha do jungler deles: onde foi visto e há quanto tempo — o que mais importa no minimapa. */
function jgLinha(d){
  const jg = (d.inimigos ?? []).find(j => j.role === 'jungle');
  if (!jg) return '';
  const v = jg.visto;
  const LUG = { top: 'top', mid: 'mid', bot: 'bot', jungle: 'jungle', rio: 'rio', barao: 'barão', dragao: 'dragão', base: 'base' };
  if (jg.morto) return `<div class="jg">${icone(jg.campeao)}<span>Jungler <b>morto</b></span></div>`;
  if (!v) return `<div class="jg">${icone(jg.campeao)}<span>Jungler <b>não visto</b></span></div>`;
  const onde = `${LUG[v.lane] ?? v.lane}${v.lado === 'deles' ? ' deles' : v.lado === 'nosso' ? ' nosso' : ''}`;
  const cls = v.ha <= 3 ? (v.lado === 'nosso' ? 'perigo' : '') : v.ha >= 20 ? 'sumido' : '';
  const tm = (d.olho?.timers ?? []).map(x => `<span style="margin-right:8px">${esc(x.nome)} <b>${x.em <= 0 ? 'nasceu' : mmss(x.em)}</b></span>`).join('');
  const pw = d.olho?.pitWard;
  const wardLinha = pw ? `<div class="jg ${pw.ward ? '' : 'perigo'}" style="font-size:11px"><span></span><span>${esc(pw.objetivo)} ${pw.em > 0 ? 'em ' + mmss(pw.em) : 'no mapa'}: ${pw.ward ? 'ward no pit' : '<b>sem ward no pit</b>'}</span></div>` : '';
  const timersLinha = (tm ? `<div class="jg" style="font-size:11px;color:var(--fraco)"><span></span><span>${tm}</span></div>` : '') + wardLinha;
  const pg = d.olho?.gankPrevisto;
  const prev = pg ? `<div class="jg" style="font-size:11px;color:var(--fraco)"><span></span><span>gank previsto: <b>${esc(pg.lane)}</b> ${mmss(pg.de)}–${mmss(pg.ate)}</span></div>` : '';
  return `<div class="jg ${cls}">${icone(jg.campeao)}<span>Jungler <b>${esc(onde)}</b></span><span class="ha">${v.ha <= 3 ? 'agora' : `há ${v.ha}s`}</span></div>${prev}${timersLinha}`;
}
// Olho cego: outra janela na frente do jogo (o olho lê a tela, não o jogo)
function linhaAvaliada(d){ const a = d.olho?.avaliada; return a ? `<div class="jg" style="font-size:11px;color:var(--fraco)"><span></span><span>${a.nota === 1 ? '👍' : '👎'} ${esc(a.texto)}</span></div>` : ''; }
function linhaCego(d){ return (d.olho?.cego ? `<div class="jg perigo"><span></span><span>Olho cego: <b>janela na frente do jogo</b></span></div>` : '') + (d.numlock === false ? `<div class="jg perigo"><span></span><span><b>NumLock desligado</b> — Num1–9 não funcionam</span></div>` : ''); }
let escalaAtual = 1, ajuste = false;
/* ---- modo ajuste: arrastar, redimensionar, escala ---- */
async function lerAjuste(){
  try { const a = await fetch('/api/overlay/estado').then(r => r.json()); if (a.ajuste !== ajuste) { ajuste = a.ajuste; document.body.classList.toggle('ajuste', ajuste); } } catch {}
}
let arr = null;
function comecarArrasto(ev, tipo){ ev.preventDefault(); arr = { tipo, x: ev.screenX, y: ev.screenY, t: 0 }; }
window.addEventListener('mousemove', (ev) => {
  if (!arr) return; const dx = ev.screenX - arr.x, dy = ev.screenY - arr.y; if (!dx && !dy) return;
  if (Date.now() - arr.t < 25) return; arr.t = Date.now(); arr.x = ev.screenX; arr.y = ev.screenY;
  const q = arr.tipo === 'mover' ? `dx=${dx}&dy=${dy}` : `dw=${dx}&dh=${dy}`;
  fetch('/api/overlay/mover?' + q).catch(() => {});
});
window.addEventListener('mouseup', () => { arr = null; });
let radarAtual = 'm';
async function radarCiclo(){ await fetch('/api/overlay/tamanho?radar=ciclo', { method: 'POST' }).catch(() => {}); }
async function escalar(delta){ const nova = Math.round((escalaAtual + delta) * 100) / 100; await fetch('/api/overlay/tamanho?escala=' + nova, { method: 'POST' }).catch(() => {}); }
async function pronto(){ await fetch('/api/overlay/ajustar?ligar=0', { method: 'POST' }).catch(() => {}); ajuste = false; document.body.classList.remove('ajuste'); }
function barraAjuste(){
  return `<div class="ajusteBarra"><span class="pega" onmousedown="comecarArrasto(event,'mover')">⠿ arrasta pra mover</span><button onclick="escalar(-0.1)">−</button><b>${Math.round(escalaAtual * 100)}%</b><button onclick="escalar(0.1)">+</button><button onclick="radarCiclo()" title="tamanho do radar: pequeno, médio, grande, desligado">radar ${esc(radarAtual)}</button><button class="ok" onclick="pronto()">Pronto</button></div><div class="canto" onmousedown="comecarArrasto(event,'tamanho')" title="arrasta pra redimensionar">◢</div>`;
}
function desenhar(d){
  const esc0 = Number(d.overlayEscala) || 1;
  radarAtual = d.overlayRadar ?? 'm';
  if (esc0 !== escalaAtual) { escalaAtual = esc0; document.body.style.zoom = String(esc0); }
  const hud = document.getElementById('hud');
  if(!d.emJogo && !ajuste){ hud.classList.add('oculto'); return; }
  if(!d.emJogo){ hud.classList.remove('oculto'); hud.innerHTML = barraAjuste() + `<div class="topo"><span></span><span class="t">12:34</span><span class="kda">3/1/7<span>142 cs</span></span></div><div class="jg"><span></span><span>Jungler <b>no bot, nosso lado</b></span><span class="ha">agora</span></div><div class="cab"><span>Inimigos</span></div><div class="jg"><span></span><span>exemplo — o overlay de verdade aparece na partida</span></div>`; return; }
  hud.classList.remove('oculto');
  const e = d.estado, eu = e.eu;
  const objs = (d.objetivos ?? []).map(o => `<div class="obj ${CLS[o.nome] ?? ''} ${o.vivo ? 'vivo' : (o.em <= 60 ? 'perto' : '')}"><i></i><div><b>${esc(o.nome)}</b><span>${o.vivo ? 'no mapa' : mmss(o.em)}</span></div></div>`).join('');
  const inis = (d.inimigos ?? []).map(j => {
    const f = j.flashMarcado ? (j.flashEm > 0 ? 'usado' : 'voltou') : 'livre';
    const txt = j.flashMarcado ? (j.flashEm > 0 ? mmss(j.flashEm) : 'flash ✓') : 'flash?';
    const pct = j.flashMarcado && j.flashEm > 0 ? Math.round(j.flashEm / 300 * 100) : 0;
    return `<div class="ini ${j.morto ? 'morto' : ''}">${icone(j.campeao)}<span class="n">${esc(j.campeao)}<small>${esc(j.role ?? '')}</small>${visto(j.visto)}</span>
      ${j.tecla ? `<kbd>${esc(tecla(j.tecla))}</kbd>` : '<span></span>'}
      <span class="f ${f}">${txt}${pct ? `<span class="bar"><i style="width:${pct}%"></i></span>` : ''}${j.feiticoEm ? `<small class="fx">${esc(j.feiticoEm.nome)} ${j.feiticoEm.aproximado ? '≤' : ''}${mmss(j.feiticoEm.em)}</small>` : ''}</span></div>`;
  }).join('');
  const ultima = (d.falas ?? []).at(-1);
  if (ultima && ultima.seq !== ultimaFala?.seq) { ultimaFala = ultima; ultimaFalaEm = Date.now(); }
  const mostraFala = ultimaFala && Date.now() - ultimaFalaEm < 12000;
  const urgente = (d.conselhos ?? []).find(c => c.urgencia === 3);
  hud.innerHTML = (ajuste ? barraAjuste() : '') + `<div class="topo">${icone(eu.campeao)}<span class="t">${mmss(e.tempo)}</span>
      <span class="kda">${eu.kills}/${eu.mortes}/${eu.assists}<span>${eu.cs ?? 0} cs</span></span></div>
    <div class="objs">${objs}</div>
    ${linhaCego(d)}${jgLinha(d)}${linhaAvaliada(d)}
    ${radar(d)}
    <div class="cab"><span>Inimigos${(() => { const n = (d.inimigos ?? []).filter(j => !j.morto && (!j.visto || j.visto.ha > 15)).length; return n >= 2 ? ` · <em style="font-style:normal;color:var(--g2)">${n} sumidos</em>` : ''; })()}</span><span>flash</span></div>
    ${inis}
    ${mostraFala ? `<div class="fala u${ultimaFala.prioridade ?? 1}">${esc(ultimaFala.serio)}</div>` : (urgente ? `<div class="fala u3">${esc(urgente.titulo)}</div>` : '')}`;
}
async function tick(){
  try {
    const d = await fetch('/api/vivo').then(r => r.json());
    if (typeof d.overlayAjuste === 'boolean' && d.overlayAjuste !== ajuste) { ajuste = d.overlayAjuste; document.body.classList.toggle('ajuste', ajuste); }
    if (ajuste) { desenhar(d); return; }
    const json = JSON.stringify([d.emJogo, d.estado?.tempo, d.objetivos, d.inimigos?.map((j) => [j.morto, j.flashEm, j.feiticoEm?.em, j.visto?.lane, j.visto?.ha, Math.round((j.visto?.x ?? 0) * 40), Math.round((j.visto?.y ?? 0) * 40)]), d.overlayRadar, (d.radarNossos ?? []).map((a) => [Math.round(a.x * 40), Math.round(a.y * 40)]), d.falas?.at(-1)?.seq, d.estado?.eu?.kills, d.estado?.eu?.mortes, d.estado?.eu?.cs]);
    if (json === ultimoJson && Date.now() - ultimaFalaEm > 13000) return;
    ultimoJson = json;
    desenhar(d);
  } catch {}
}
tick(); setInterval(tick, 1500);
</script>
</body>
</html>
